[project]
name = "vis-music"
version = "0.2.0"
description = "Compose music for Vis as Strudel code: play it live layer by layer and export WAV, MP3 or stems."
keywords = ["media", "music"]
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "vis-agent>=0.5.30",
  "vis-lang-interface @ git+https://github.com/Blockether/vis-lang-interface@v4.3.0",
  "nodejs-wheel-binaries>=22",
  "lameenc>=1.7; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md", "src/vis_music/engine", "js"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
python_classes = []
