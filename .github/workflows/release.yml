name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-24.04
    env:
      VIS_MUSIC_NO_AUDIO: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install the libraries that node-web-audio-api needs
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 libdbus-1-3 libpipewire-0.3-0t64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  release:
    name: Publish the GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the declared versions
        run: |
          set -euo pipefail
          package=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          registered=$(python3 -c "import re,pathlib;print(re.search(r'VERSION = \"([^\"]+)\"', pathlib.Path('extension.py').read_text()).group(1))")
          for found in "$package" "$registered"; do
            if [ "v$found" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME disagrees with pyproject version $package and extension version $registered." >&2
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Start the publication in the Vis Extension Center at once. The schedule in Blockether/vis
      # also publishes this release, but GitHub starts scheduled runs some hours late.
      - name: Publish the release in the Vis Extension Center
        env:
          GH_TOKEN: ${{ secrets.VIS_EXTENSION_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set the VIS_EXTENSION_PUBLISH_TOKEN secret. Without it, the schedule in Blockether/vis publishes this release some hours later."
            exit 0
          fi
          gh workflow run extension-publish.yml --repo Blockether/vis \
            -f repository_url="https://github.com/$GITHUB_REPOSITORY" \
            -f subdirectory="" \
            -f release_tag="$GITHUB_REF_NAME" \
            -f revision="$GITHUB_SHA"
